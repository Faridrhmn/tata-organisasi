# ========================================================
# TARI (Tata Organisasi) — Production Nginx Configuration
# Reverse Proxy, SSL Hardening, Rate Limiting & Static SPA
# ========================================================

# 1. Rate Limiting Zones (DDoS & Brute Force Prevention)
limit_req_zone $binary_remote_addr zone=tari_api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=tari_auth_limit:10m rate=5r/m;

# 2. HTTP Server — Redirect all unencrypted traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name tari.yourdomain.com;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 3. HTTPS Server — Production SSL Application Gateway
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tari.yourdomain.com;

    # SSL Certificates (Managed by Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/tari.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tari.yourdomain.com/privkey.pem;

    # Modern TLS Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Static Frontend SPA Root (React + Vite build dist)
    root /opt/tari/current/frontend/dist;
    index index.html;

    client_max_body_size 50M;

    # Gzip Compression for Fast Assets Delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Frontend SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Static Assets Long-term Caching
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Sensitive Auth Endpoints Rate-Limited (5 req/min)
    location /api/v1/auth/ {
        limit_req zone=tari_auth_limit burst=3 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rust Axum Backend API Proxy
    location /api/ {
        limit_req zone=tari_api_limit burst=15 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Uploaded media storage
    location /uploads/ {
        alias /opt/tari/shared/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
