# ========================================================
# Nginx Configuration for tari.faridrhmn.my.id
# TARI (Tata Organisasi) - Static SPA & Axum API Proxy
# ========================================================

# 1. Rate Limiting Zones (DDoS & Brute Force Prevention)
limit_req_zone $binary_remote_addr zone=tari_api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=tari_auth_limit:10m rate=5r/m;

# 2. HTTP Server — Initial configuration before Certbot enables SSL
server {
    listen 80;
    listen [::]:80;
    server_name tari.faridrhmn.my.id;

    # Static Frontend SPA Root (React + Vite build dist)
    root /home/ubuntu/Program/tata-organisasi/frontend/dist;
    index index.html;

    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Frontend SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Static Assets Long-term Caching
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Sensitive Auth Endpoints Rate-Limited (5 req/min)
    location /api/v1/auth/ {
        limit_req zone=tari_auth_limit burst=3 nodelay;

        proxy_pass http://127.0.0.1:1999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rust Axum Backend API Proxy (Port 1999)
    location /api/ {
        limit_req zone=tari_api_limit burst=15 nodelay;

        proxy_pass http://127.0.0.1:1999;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Backend Health Check
    location /health {
        proxy_pass http://127.0.0.1:1999/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
