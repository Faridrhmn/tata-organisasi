services:
  postgres:
    image: postgres:16-alpine
    container_name: tari-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tari_user
      POSTGRES_PASSWORD: tari_secret_password
      POSTGRES_DB: tari_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tari_user -d tari_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: tari-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tari_minio_admin
      MINIO_ROOT_PASSWORD: tari_minio_secret_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:

